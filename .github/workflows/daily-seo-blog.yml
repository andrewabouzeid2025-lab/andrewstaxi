name: Daily SEO Blog Post

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-seo-blog
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          persist-credentials: true
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Generate today's blog post
        id: generate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          npm install
          node scripts/generate-blog.js

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p public/images blog
          git add blog public/images public/sitemap.xml
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "content: add ${{ steps.generate.outputs.slug }}"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Post to Socials
        if: steps.generate.outputs.slug != ''
        env:
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          POST_SLUG: ${{ steps.generate.outputs.slug }}
          POST_TITLE: ${{ steps.generate.outputs.title }}
          POST_EXCERPT: ${{ steps.generate.outputs.excerpt }}
          POST_IMAGE: ${{ steps.generate.outputs.image }}
        run: node scripts/post-to-buffer.js
